  head_html: |
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="_/theme/echarts_theme.js"></script>
    <link rel="stylesheet" href="_/theme/craftify-full-theme.css">
    <script>
    function getScrollPosition(selector) {
      return $(selector).scrollTop();
    }
    function restoreScrollPosition(selector, scrollPosition) {
      $(selector).scrollTop(scrollPosition);
    }
    </script>
