<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<style>
  .kc-page {
    --navy: #1e3a5f;
    --muted: #64748b;
    --line: #e2e8f0;
    --font: Montserrat, system-ui, sans-serif;
    font-family: var(--font);
    color: #0f172a;
    width: 100%;
  }
  .kc-page,
  .kc-page * { box-sizing: border-box; }

  .anvil-html-component:has(.kc-page),
  .anvil-html-component:has(.kc-page) > .anvil-html-content {
    padding: 0 !important;
    margin: 0 !important;
    max-width: none !important;
    width: 100% !important;
    background: transparent !important;
  }

  .kc-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    min-height: 84px;
    height: 100%;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .kc-card.is-clickable { cursor: pointer; }
  .kc-card.is-clickable:hover {
    border-color: #cbd5e1;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
  }
  .kc-card.is-selected {
    border-color: var(--navy);
    box-shadow: inset 0 0 0 1px var(--navy);
  }
  .kc-card.is-disabled {
    opacity: 0.45;
    pointer-events: none;
  }
  .kc-label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    min-height: 16px;
  }
  .kc-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--navy);
    flex: 0 0 auto;
    line-height: 1;
  }
  .kc-icon.is-empty { display: none; }
  .kc-icon .material-symbols-outlined {
    font-size: 18px;
    font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 20;
  }
  .kc-icon .fa,
  .kc-icon .fa-solid { font-size: 14px; }
  .kc-card b.is-empty { display: none; }
  .kc-card b {
    display: block;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 650;
  }
  .kc-card:has(b.is-empty) {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kc-card:has(b.is-empty) .kc-label { margin: 0; }
  .kc-card:has(b.is-empty) strong { font-size: 16px; }
  .kc-card strong {
    display: block;
    font-size: 22px;
    font-weight: 650;
    color: var(--navy);
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .kc-card em {
    display: block;
    font-style: normal;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .kc-card em.is-empty { display: none; }
  .kc-card.is-good strong { color: #059669; }
  .kc-card.is-warn strong { color: #d97706; }
  .kc-card.is-bad strong { color: #dc2626; }
</style>
<div class="kc-page">
  <div class="kc-card" anvil-name="card">
    <div class="kc-label">
      <span class="kc-icon is-empty" anvil-name="icon"></span>
      <b class="is-empty" anvil-name="title"></b>
    </div>
    <strong anvil-name="value">—</strong>
    <em class="is-empty" anvil-name="subtitle"></em>
  </div>
</div>
