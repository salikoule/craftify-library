<style>
  .am-wrap {
    --navy: #1e3a5f;
    --muted: #64748b;
    --line: #e2e8f0;
    position: relative;
    width: 100%;
    font-family: Montserrat, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .am-wrap,
  .am-wrap * { box-sizing: border-box; }
  .am-menu {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + 8px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    z-index: 40;
    box-shadow: 0 16px 40px rgba(15, 39, 68, 0.14);
  }
  .am-menu.am-off { display: none; }
  .am-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 14px;
    border: 0;
    background: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #0f172a;
    text-align: left;
    cursor: pointer;
  }
  .am-item:hover { background: #f8fafc; }
  .am-item .am-ico {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #334155;
    font-size: 13px;
    flex: 0 0 auto;
  }
  .am-item .am-ico i,
  .am-item .am-ico .fa,
  .am-item .am-ico .fa-solid {
    font-size: 14px;
    line-height: 1;
    width: 14px;
    text-align: center;
  }
  .am-item.am-danger { color: #b91c1c; }
  .am-item.am-danger .am-ico { color: #b91c1c; }
  .am-rule { height: 1px; background: var(--line); }
  .am-box {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    padding: 8px 10px;
    position: relative;
    z-index: 1;
  }
  .am-box:hover { border-color: #9bb6d3; background: #f8fafc; }
  .am-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: 0;
    padding: 0;
    background: transparent;
    font: inherit;
    cursor: pointer;
    text-align: left;
  }
  .am-ava-wrap { position: relative; width: 32px; height: 32px; flex: 0 0 auto; }
  .am-ava {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #e8f1fb;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .am-ava.has-photo { color: transparent; }
  .am-email {
    min-width: 0;
    flex: 1;
    font-size: 11px;
    font-weight: 650;
    color: #0f172a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .am-chev { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
  .am-wrap.am-open .am-chev { transform: rotate(180deg); }
  .am-off { display: none !important; }
  .structure.nav-collapsed .am-email,
  .structure.nav-collapsed .am-chev { display: none; }
  .structure.nav-collapsed .am-box { padding: 8px; }
  .structure.nav-collapsed .am-chip { justify-content: center; }
  .structure.nav-collapsed .am-menu { left: 8px; right: auto; width: 220px; }
</style>

<div class="am-wrap" anvil-name="am_root">
  <div class="am-menu am-off" anvil-name="am_menu">
    <button type="button" class="am-item" data-action="settings" anvil-name="am_settings_item">
      <span class="am-ico"><i class="fa-solid fa-gear" aria-hidden="true"></i></span>
      Settings
    </button>
    <button type="button" class="am-item" data-action="reload">
      <span class="am-ico"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></span>
      Reload page
    </button>
    <div class="am-rule"></div>
    <button type="button" class="am-item am-danger" data-action="logout" anvil-name="am_logout_item">
      <span class="am-ico"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i></span>
      Logout
    </button>
  </div>
  <div class="am-box">
    <button type="button" class="am-chip" anvil-name="am_chip"
      onclick="event.preventDefault(); event.stopPropagation(); var w=this.closest('.am-wrap'); if(!w) return; var open=w.classList.toggle('am-open'); var m=w.querySelector('.am-menu'); if(m) m.classList.toggle('am-off', !open);">
      <span class="am-ava-wrap">
        <span class="am-ava" anvil-name="am_initials">?</span>
      </span>
      <span class="am-email" anvil-name="am_email"></span>
      <span class="am-chev">⌃</span>
    </button>
  </div>
</div>
