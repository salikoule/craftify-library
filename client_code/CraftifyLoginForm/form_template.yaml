components:
- components:
  - components:
    - layout_properties: {full_width_row: true}
      name: brand_title
      properties: {align: center, bold: true, font_size: 42, foreground: 'theme:White', role: login-heading, spacing_above: none, spacing_below: none, text: Craftify}
      type: Label
    - layout_properties: {full_width_row: true}
      name: brand_subtitle
      properties: {align: center, font_size: 16, foreground: 'theme:White', role: login-subtitle, spacing_above: small, spacing_below: none, text: Sign in to continue}
      type: Label
    layout_properties: {full_width_row: true}
    name: home_header_card
    properties: {role: home-header, spacing_above: none, spacing_below: none}
    type: ColumnPanel
  - components:
    - layout_properties: {}
      name: site_link
      properties: {align: center, font_size: 12, foreground: 'theme:White', role: login-hero-link, text: craftify}
      type: Link
    layout_properties: {full_width_row: true}
    name: footer_row
    properties: {align: center, role: login-footer-left, spacing_above: none, spacing_below: none}
    type: FlowPanel
  layout_properties: {full_width_row: true, grid_position: 'LOGINR,HEROCL'}
  name: left_panel
  properties: {role: login-hero}
  type: ColumnPanel
- components:
  - components:
    - layout_properties: {full_width_row: true}
      name: login_title
      properties: {align: left, bold: true, font_size: 28, role: login-heading, spacing_above: none, spacing_below: none, text: Sign in}
      type: Label
    - layout_properties: {full_width_row: true}
      name: login_subtitle
      properties: {align: left, font_size: 14, role: login-subtitle, spacing_above: none, spacing_below: small, text: Welcome back. Enter your details to continue.}
      type: Label
    - layout_properties: {full_width_row: true}
      name: email_label
      properties: {align: left, font_size: 13, role: login-field-label, spacing_above: small, spacing_below: none, text: Email}
      type: Label
    - event_bindings: {pressed_enter: login_btn_click}
      layout_properties: {full_width_row: true}
      name: email_textbox
      properties: {placeholder: name@company.com, role: login-input, spacing_above: none, spacing_below: small, type: email}
      type: TextBox
    - layout_properties: {full_width_row: true}
      name: password_label
      properties: {align: left, font_size: 13, role: login-field-label, spacing_above: small, spacing_below: none, text: Password}
      type: Label
    - event_bindings: {pressed_enter: login_btn_click}
      layout_properties: {full_width_row: true}
      name: password_textbox
      properties: {hide_text: true, placeholder: Enter your password, role: login-input, spacing_above: none, spacing_below: none}
      type: TextBox
    - event_bindings: {click: forgot_password_link_click}
      layout_properties: {full_width_row: true}
      name: forgot_password_link
      properties: {align: right, role: login-link, spacing_above: none, spacing_below: small, text: 'Forgot password?'}
      type: Link
    - event_bindings: {click: login_btn_click}
      layout_properties: {full_width_row: true}
      name: login_btn
      properties: {align: center, bold: true, role: login-primary-btn, spacing_above: small, spacing_below: small, text: Sign in}
      type: Button
    - layout_properties: {full_width_row: true}
      name: error_label
      properties: {align: left, font_size: 13, foreground: 'theme:Error', visible: false}
      type: Label
    - layout_properties: {full_width_row: true}
      name: or_divider
      properties: {align: center, role: login-divider, spacing_above: small, spacing_below: small, text: or continue with}
      type: Label
    - event_bindings: {click: google_login_btn_click}
      layout_properties: {full_width_row: true}
      name: google_login_btn
      properties: {align: center, role: login-sso-btn, spacing_above: none, spacing_below: small, text: Google}
      type: Button
    - event_bindings: {click: signup_btn_click}
      layout_properties: {full_width_row: true}
      name: signup_btn
      properties: {align: center, role: login-sso-btn, spacing_above: none, spacing_below: none, text: Create account}
      type: Button
    layout_properties: {grid_position: 'LGCARD,LGFORM'}
    name: login_form_card
    properties: {role: card, spacing_above: none, spacing_below: none}
    type: ColumnPanel
  - layout_properties: {full_width_row: true}
    name: copyright_link
    properties: {align: center, role: login-footer-copy, spacing_above: none, spacing_below: none, text: © Craftify}
    type: Link
  layout_properties: {full_width_row: true, grid_position: 'LOGINR,FORMCL'}
  name: login_panel
  properties: {role: login-card}
  type: ColumnPanel
container:
  event_bindings: {show: form_show}
  properties: {col_widths: '{"HEROCL":50,"FORMCL":50}', role: login-page}
  type: ColumnPanel
is_package: true
